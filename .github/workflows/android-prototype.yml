name: Android prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Godot Android export paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and Android export templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot" "$RUNNER_TEMP/godot-templates"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            --output "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            --output "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp "$RUNNER_TEMP/godot-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          echo "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"
          "$RUNNER_TEMP/godot/godot" --version

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Run deterministic rules tests
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee build/headless-tests.log

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-test-diagnostics
          path: build/headless-tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Export debug APK
        id: export_android_apk
        run: |
          mkdir -p build
          set -o pipefail
          godot --headless --path . --export-debug Android build/PULSE-debug.apk 2>&1 | tee build/android-export.log
          test -s build/PULSE-debug.apk

      - name: Upload failed Android export diagnostics
        if: failure() && steps.export_android_apk.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-android-export-diagnostics
          path: build/android-export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify APK signature and offline package
        run: |
          APK="build/PULSE-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee build/apk-signature.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee build/apk-metadata.txt
          "$BUILD_TOOLS/aapt" dump permissions "$APK" | tee -a build/apk-metadata.txt
          grep -F "package: name='org.pulsegame.prototype' versionCode='1' versionName='0.1.0'" build/apk-metadata.txt
          if grep -Fq 'android.permission.INTERNET' build/apk-metadata.txt; then
            echo 'Offline prototype APK unexpectedly requests INTERNET permission.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee build/apk-sha256.txt

      - name: Upload APK verification record
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-apk-verification
          path: build/apk-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSE-debug-apk
          path: build/PULSE-debug.apk
          if-no-files-found: error
          retention-days: 14
